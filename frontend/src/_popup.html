<div id="trial" class="popup">
  <div class="popup__body">
    <div class="popup__inner">
      <div class="popup__content">
        <button class="popup__close" type="button">Закрыть</button>
        <h3 class="popup__heading">Записаться на пробное занятие</h3>
        <form id="form-popup" class="form" data-form="trial-form">
          <div class="form__section form__section--bottom-gutter-lg">
            <div class="form__group form__group--col-2">
              <div class="tab-label form__item">
                <label class="tab-label__label">
                  <span class="tab-label__text">Взрослые</span>
                  <input
                    class="tab-label__input visible-hidden"
                    name="for-whom"
                    type="radio"
                    data-state-fields="hide"
                    checked
                  />
                  <span class="tab-label__underline"></span>
                </label>
              </div>
              <div class="tab-label form__item">
                <label class="tab-label__label">
                  <span class="tab-label__text">Дети</span>
                  <input
                    class="tab-label__input visible-hidden"
                    name="for-whom"
                    type="radio"
                    data-state-fields="show"
                  />
                  <span class="tab-label__underline"></span>
                </label>
              </div>
            </div>
          </div>
          <div class="form__section form__section--select-language">
            <div class="form__item form__item--select">
              <select class="field" name="course_id" id="lang-popup">
                <option selected>Выберите язык</option>
              </select>
              <div class="form-error" id="error-course_id"></div>
            </div>
          </div>
          <div class="form__section form__section--education-place">
            <div class="form__group form__group--col-2">
              <div class="form__item">
                <input
                  class="radio-button"
                  name="where-study"
                  id="school"
                  type="radio"
                  checked
                />
                <label class="label" for="school-popup">Занятия в клубе</label>
              </div>
              <div class="form__item">
                <input class="radio-button" name="where-study" id="online" type="radio" />
                <label class="label" for="online-popup">Онлайн-занятия</label>
              </div>
            </div>
          </div>
          <div class="form__section form__section--student-info">
            <div class="form__group form__group--col-2">
              <div class="form__item">
                <input
                id="name"
                class="field field--text"
                name="name"
                type="text"
                placeholder="Ваше имя"
                required
              />
              </div>
              <div class="form__item">
                <input type="tel" id="phone" name="phone" 
                class="field field--text" required 
                pattern="^\+?\d{10,17}$"
                placeholder="Ваш телефон"
                title="Номер должен содержать от 10 до 17 цифр и может начинаться с +">
                
              </div>
              
            </div>
            <div class="form__group form__group--col-2 form__group--additional hide">
              <div class="form__item">
                  <input 
                      class="field field--text" 
                      name="child_name" 
                      type="text" 
                      placeholder="Имя ребенка"
                      required
                  />
                  <div class="form-error" id="error-child_name"></div>
              </div>
              <div class="form__item">
                  <input 
                      class="field field--text" 
                      name="child_age" 
                      type="number" 
                      placeholder="Возраст ребенка"
                      min="3"
                      max="17"
                      required
                  />
                  <div class="form-error" id="error-child_age"></div>
              </div>
          </div>
            <div class="form__group">
              <div class="form__item">
              <input
              id="email"
              class="field field--text"
              name="email"
              type="email"
              placeholder="Ваша почта"
              required
            /></div>
          </div>
          <label class="form__politic">
            <input type="checkbox" onchange="document.getElementById('mc-embedded-subscribe').disabled = !this.checked" name="accept" required/> Я ознакомлен(-а) с <a href="privacy.html" target="_blank">Политикой конфиденциальности</a>
        </label>
        <div class="form__section form__section--submit form__section--bottom-gutter-lg">
            <input class="btn btn--size-normal btn--purple" type="submit" value="Отправить" id="mc-embedded-subscribe" />
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
</div>
