<!DOCTYPE html>
<html lang="ru">
  @@include('_head.html',{ "title":"Speech School" })

  <body>
    @@include('_header.html',{})
    <main class="page">
        <section class="promo page__item page__item--gutter-static-100">
            <div class="container">

      <div class="popup__inner">
        <div class="popup__content">
          <h3 class="popup__heading">Регистрация</h3>
          <div id="form-error" class="form__error" style="color: red; margin-top: 10px;"></div>
          <form id="registerForm" class="form">
            <div class="form__section form__section--student-info">
              <div class="form__group form__group--col-2">
                <div class="form__item">
                  <input class="field field--text" type="text" id="name" name="name" placeholder="Ваше имя" value="" required autocomplete="name" />
                </div>
                <div class="form__item">
                  <input class="field field--text" type="tel" id="phone" name="phone" placeholder="Ваш телефон" value="" required autocomplete="tel" />
                </div>
              </div>
              <div class="form__group">
                <div class="form__item">
                  <input class="field field--text" type="email" id="email" name="email" placeholder="Ваша почта" value="" required autocomplete="email" />
                </div>
              </div>
              <div class="form__group">
                <div class="form__item">
                  <input class="field field--text" type="password" id="password" name="password" placeholder="Пароль" value="" required autocomplete="new-password" />
                </div>
              </div>
              <div class="form__group">
                <div class="form__item">
                  <input class="field field--text" type="password" id="password_confirm" name="password_confirm" placeholder="Подтвердите пароль" value="" required autocomplete="new-password" />
                </div>
              </div>
            </div>
          
            <label class="form__politic">
              <input type="checkbox" name="accept" id="accept" required autocomplete="off" /> Я ознакомлен(-а) с <a href="privacy.html" target="_blank">Политикой конфиденциальности</a>
            </label>
          
            <div class="form__section form__section--submit form__section--bottom-gutter-lg">
              <input class="btn btn--size-normal btn--purple" type="submit" value="Зарегистироваться" id="submit-btn" />
            </div>
          
            <a href="login.html" class="education__link">У меня уже есть аккаунт</a>
          </form>
